<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5" />
    <title>El Pollo Loco</title>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/status-bars.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chick.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/bottles.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/script.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/template.js"></script>
    <script src="js/game.js"></script>
  </head>
  <body onload="renderOverlays()">
    <h1>El Pollo Loco</h1>
    <div class="canvas-container">
      <div class="rotate-screen">
        <div class="rotate-icon-container">
          <img class="rotate-icon" src="assets/icons/rotate.png" alt="" />
          <p>Please rotate your Device!</p>
        </div>
      </div>

      <div class="game-wrapper">
        <div id="startScreen" class="start-screen">
          <!--startscreem rendered here-->
        </div>
        <div id="controlScreen" class="control-screen d-none">
          <!--Controlscreen rendered here-->
        </div>
        <div id="winScreen" class="win-screen d-none">
          <!--winScreen rendered here-->
        </div>

        <div id="loseScreen" class="lose-screen d-none">
          <!--loseScreen rendered here-->
        </div>

        <div id="imprint" class="control-screen d-none">
          <!--imprint rendered here-->
        </div>

        <canvas class="d-none" id="canvas" width="960" height="540"></canvas>
        <div class="single-icon-box sound-toggle" onclick="toggleSound()" id="soundToggle">
          <img class="icons" src="assets/icons/sound-off.png" alt="" />
        </div>
        <div class="controls">
          <div class="left-controls">
            <img id="btnLeft" src="assets/icons/buttonLeft.png" alt="button-left" draggable="false" oncontextmenu="return false;" />
            <img id="btnRight" src="assets/icons/buttonRight.png" alt="button-right" draggable="false" oncontextmenu="return false;" />
          </div>
          <div class="right-controls">
            <img id="btnJump" src="assets/icons/buttonUp.png" alt="button.up" draggable="false" oncontextmenu="return false;" />
            <img id="btnThrow" src="assets/icons/bottle.png" alt="bottle-button" draggable="false" oncontextmenu="return false;" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
